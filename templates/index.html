<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat en tiempo real conectado con Telegram para taxistas y la central. Comunicación instantánea y ubicación GPS.">
    <title>Chat los Guñis-Chisme24-7</title>
    
    <!-- Google Fonts - Plus Jakarta Sans & Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* M3 Light Palette */
            --md-sys-color-primary: #0b57d0;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #d3e3fd;
            --md-sys-color-on-primary-container: #041e49;
            
            --md-sys-color-surface: #ffffff;
            --md-sys-color-on-surface: #1f1f1f;
            --md-sys-color-surface-variant: #f1f3f4;
            --md-sys-color-on-surface-variant: #444746;
            --md-sys-color-surface-container: #f0f4f9;
            --md-sys-color-surface-container-high: #e9eef6;
            
            --md-sys-color-background: #f8f9fa;
            --md-sys-color-on-background: #1f1f1f;
            
            --md-sys-color-outline: #747775;
            --md-sys-color-outline-variant: #c4c7c5;
            
            --md-sys-color-error: #b3261e;
            --md-sys-color-on-error: #ffffff;
            
            /* Elevaciones M3 */
            --md-sys-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.15);
            --md-sys-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.08), 0px 1px 2px 0px rgba(0, 0, 0, 0.15);
            --md-sys-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.10), 0px 1px 3px 0px rgba(0, 0, 0, 0.15);
            
            /* Formas M3 */
            --md-sys-shape-corner-small: 8px;
            --md-sys-shape-corner-medium: 12px;
            --md-sys-shape-corner-large: 16px;
            --md-sys-shape-corner-extra-large: 28px;
            
            /* Bubble Palette */
            --msger-color-primary: #0084ff;
            --msger-color-on-primary: #ffffff;
            --msger-color-received: #e4e6eb;
            --msger-color-on-received: #050505;
        }

        [data-theme="dark"] {
            /* M3 Dark Palette */
            --md-sys-color-primary: #a8c7fa;
            --md-sys-color-on-primary: #062e6f;
            --md-sys-color-primary-container: #0842a0;
            --md-sys-color-on-primary-container: #d3e3fd;

            --md-sys-color-surface: #1a1a1a;
            --md-sys-color-on-surface: #e3e3e3;
            --md-sys-color-surface-variant: #303030;
            --md-sys-color-on-surface-variant: #c4c7c5;
            --md-sys-color-surface-container: #2d2f31;
            --md-sys-color-surface-container-high: #3b3d40;
            
            --md-sys-color-background: #0f0f0f;
            --md-sys-color-on-background: #e3e3e3;
            
            --md-sys-color-outline: #8e918f;
            --md-sys-color-outline-variant: #444746;
            
            --md-sys-color-error: #f2b8b5;
            --md-sys-color-on-error: #601410;
            
            --msger-color-received: #303030;
            --msger-color-on-received: #e4e6eb;
        }

        /* ===================================== */
        /* BASE & LAYOUT */
        /* ===================================== */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', 'Roboto', -apple-system, sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Contenedor principal responsive */
        .chat-container {
            width: 100%;
            height: 100dvh;
            background-color: var(--md-sys-color-surface);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Restricciones solo en Escritorio (Pantallas mayores a 768px) */
        @media (min-width: 769px) {
            body {
                padding: 24px;
            }
            .chat-container {
                height: 90vh;
                max-height: 800px;
                max-width: 720px;
                border-radius: var(--md-sys-shape-corner-extra-large);
                border: 1px solid var(--md-sys-color-outline-variant);
                box-shadow: var(--md-sys-elevation-3);
            }
        }

        /* Header */
        .chat-header {
            height: 68px;
            padding: 0 16px;
            background-color: var(--md-sys-color-surface);
            border-bottom: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 5;
            flex-shrink: 0;
        }

        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--md-sys-elevation-1);
            font-size: 15px;
            font-weight: 700;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-status {
            font-size: 11px;
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: inline-block;
        }

        /* Acciones del Header */
        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background-color: var(--md-sys-color-surface-container);
            color: var(--md-sys-color-on-surface-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .icon-btn:hover {
            background-color: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .icon-btn .material-symbols-rounded {
            font-size: 20px;
        }

        /* Feed de Mensajes */
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background-color: var(--md-sys-color-background);
            display: flex;
            flex-direction: column;
            gap: 4px;
            scrollbar-width: thin;
            scrollbar-color: var(--md-sys-color-outline-variant) transparent;
        }

        .chat-feed::-webkit-scrollbar {
            width: 6px;
        }
        .chat-feed::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-feed::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 3px;
        }

        /* ===================================== */
        /* MESSENGER BUBBLES & GROUPING */
        /* ===================================== */
        .mensaje {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            margin-bottom: 2px;
            animation: bubbleIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes bubbleIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(5px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .mensaje.remitente {
            align-self: flex-end;
            align-items: flex-end;
        }

        .mensaje.destinatario {
            align-self: flex-start;
            align-items: flex-start;
            padding-left: 36px;
        }

        .mensaje-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            position: absolute;
            left: 0;
            bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            box-shadow: var(--md-sys-elevation-1);
        }

        .mensaje-bubble {
            padding: 10px 14px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            border-radius: 18px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .mensaje.remitente .mensaje-bubble {
            background-color: var(--msger-color-primary);
            color: var(--msger-color-on-primary);
            border-bottom-right-radius: 4px;
        }

        .mensaje.destinatario .mensaje-bubble {
            background-color: var(--msger-color-received);
            color: var(--msger-color-on-received);
            border-bottom-left-radius: 4px;
        }

        .mensaje-usuario {
            font-size: 11px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 2px;
            margin-left: 4px;
        }

        .mensaje-tiempo {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 3px;
            margin-right: 6px;
            margin-left: 6px;
        }

        /* Grouping shapes */
        .mensaje.grouped-start .mensaje-bubble {
            margin-top: 8px;
        }
        .mensaje.remitente.grouped-start .mensaje-bubble {
            border-bottom-right-radius: 4px;
        }
        .mensaje.remitente.grouped-middle .mensaje-bubble {
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
        .mensaje.remitente.grouped-end .mensaje-bubble {
            border-top-right-radius: 4px;
            border-bottom-right-radius: 18px;
            margin-bottom: 8px;
        }
        .mensaje.destinatario.grouped-start .mensaje-bubble {
            border-bottom-left-radius: 4px;
        }
        .mensaje.destinatario.grouped-middle .mensaje-bubble {
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }
        .mensaje.destinatario.grouped-end .mensaje-bubble {
            border-top-left-radius: 4px;
            border-bottom-left-radius: 18px;
            margin-bottom: 8px;
        }

        /* Sistema */
        .mensaje.sistema {
            align-self: center;
            max-width: 100%;
            margin: 12px 0;
        }

        .mensaje.sistema .mensaje-bubble {
            background-color: transparent;
            color: var(--md-sys-color-on-surface-variant);
            box-shadow: none;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
        }

        /* Footer / Input */
        .chat-footer {
            padding: 12px 16px;
            background-color: var(--md-sys-color-surface);
            border-top: 1px solid var(--md-sys-color-outline-variant);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .input-wrapper {
            flex: 1;
            height: 44px;
            background-color: var(--md-sys-color-surface-container);
            border-radius: 22px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            transition: background-color 0.2s;
        }

        .input-wrapper:focus-within {
            background-color: var(--md-sys-color-surface-container-high);
        }

        .input-wrapper input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background-color: var(--msger-color-primary);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: var(--md-sys-elevation-1);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.08);
            box-shadow: var(--md-sys-elevation-2);
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        .send-btn .material-symbols-rounded {
            font-size: 20px;
            font-variation-settings: 'FILL' 1;
        }

        /* ===================================== */
        /* MODAL DE BIENVENIDA (HTML5 Dialog) */
        /* ===================================== */
        .welcome-modal {
            border: none;
            background: transparent;
            margin: auto;
            outline: none;
            max-width: 400px;
            width: 90%;
            z-index: 100;
        }

        .welcome-modal::backdrop {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .welcome-card {
            background-color: var(--md-sys-color-surface);
            border-radius: var(--md-sys-shape-corner-extra-large);
            padding: 32px;
            box-shadow: var(--md-sys-elevation-3);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid var(--md-sys-color-outline-variant);
            max-height: 90vh;
            overflow-y: auto;
        }

        @media (max-width: 480px) {
            .welcome-card {
                padding: 24px 16px;
                border-radius: var(--md-sys-shape-corner-large);
            }
        }

        .welcome-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: var(--md-sys-elevation-1);
        }
        
        .welcome-icon .material-symbols-rounded {
            font-size: 32px;
            font-variation-settings: 'FILL' 1;
        }

        .welcome-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .avatar-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: var(--md-sys-color-primary-container);
            color: var(--md-sys-color-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            box-shadow: var(--md-sys-elevation-2);
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        /* Outlined Textfield M3 */
        .m3-textfield {
            position: relative;
            width: 100%;
        }

        .m3-textfield input {
            width: 100%;
            height: 56px;
            padding: 16px;
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 4px;
            background: transparent;
            color: var(--md-sys-color-on-surface);
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        .m3-textfield label {
            position: absolute;
            left: 16px;
            top: 18px;
            transform-origin: left top;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 16px;
            pointer-events: none;
            transition: transform 0.15s ease;
            background: transparent;
        }

        .m3-textfield input:focus,
        .m3-textfield input:not(:placeholder-shown) {
            border-color: var(--md-sys-color-primary);
            box-shadow: inset 0 0 0 1px var(--md-sys-color-primary);
        }

        .m3-textfield input:focus ~ label,
        .m3-textfield input:not(:placeholder-shown) ~ label {
            transform: translate(-4px, -28px) scale(0.75);
            background-color: var(--md-sys-color-surface);
            padding: 0 6px;
            color: var(--md-sys-color-primary);
            font-weight: 600;
        }

        .m3-btn {
            height: 48px;
            padding: 0 24px;
            border: none;
            border-radius: 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            box-shadow: var(--md-sys-elevation-1);
            transition: all 0.2s ease;
            outline: none;
        }

        .m3-btn:hover {
            background-color: #1a64df;
            box-shadow: var(--md-sys-elevation-2);
            transform: translateY(-1px);
        }

        /* Snackbar */
        .snackbar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--md-sys-color-surface-container-high);
            color: var(--md-sys-color-on-surface);
            padding: 14px 24px;
            border-radius: 12px;
            box-shadow: var(--md-sys-elevation-3);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 14px;
            font-weight: 500;
            border: 1px solid var(--md-sys-color-outline-variant);
        }
        
        .snackbar.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    
    <!-- Modal de Bienvenida -->
    <dialog class="welcome-modal" id="welcomeModal">
        <div class="welcome-card">
            <div class="welcome-icon">
                <span class="material-symbols-rounded">forum</span>
            </div>
            <h1 class="welcome-title">¡Bienvenido!</h1>
            <p class="welcome-subtitle">Ingresa tu nombre para comenzar a chatear en tiempo real</p>
            
            <div class="avatar-preview" id="avatarPreview">?</div>
            
            <div class="m3-textfield">
                <input
                    type="text"
                    id="nombre"
                    placeholder=" "
                    autocomplete="off"
                    required
                >
                <label for="nombre">Tu nombre</label>
            </div>
            
            <div class="m3-textfield" style="margin-top: 16px;">
                <input type="text" id="apellido" placeholder=" " autocomplete="off" required>
                <label for="apellido">Tu apellido</label>
            </div>
            
            <div class="m3-textfield" style="margin-top: 16px;">
                <input type="text" id="placa" placeholder=" " autocomplete="off" required>
                <label for="placa">Placa de auto</label>
            </div>
            
            <div class="m3-textfield" style="margin-top: 16px;">
                <input type="text" id="modelo" placeholder=" " autocomplete="off" required>
                <label for="modelo">Modelo de auto</label>
            </div>
            
            <button
                class="m3-btn"
                id="btn-entrar"
                onclick="guardarNombre()"
                style="width: 100%; margin-top: 24px;"
            >
                <span class="material-symbols-rounded">login</span>
                <span>Entrar al chat</span>
            </button>
        </div>
    </dialog>
    
    <!-- Contenedor Principal del Chat -->
    <div class="chat-container">
        
        <!-- Header -->
        <header class="chat-header">
            <div class="chat-header-avatar" id="headerChatAvatar">
                <span class="material-symbols-rounded">forum</span>
            </div>
            
            <div class="chat-header-info">
                <h2 class="chat-title">Sala General (Los Guñis)</h2>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    <span>Sincronizado • Estoy agarrando señal carnal..</span>
                </div>
            </div>
            
            <div class="header-actions">
                <button class="icon-btn" id="editNameBtn" onclick="cambiarNombre()" title="Cambiar Nombre de Usuario">
                    <span class="material-symbols-rounded">edit</span>
                </button>
                <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Cambiar Tema">
                    <span class="material-symbols-rounded" id="themeToggleIcon">dark_mode</span>
                </button>
                <button class="icon-btn" id="logoutBtn" onclick="cerrarSesion()" title="Cerrar Sesión">
                    <span class="material-symbols-rounded">logout</span>
                </button>
            </div>
        </header>
        
        <!-- Feed de Mensajes -->
        <div class="chat-feed" id="chat">
            <!-- Los mensajes se agregan aquí dinámicamente -->
        </div>
        
        <!-- Controles -->
        <footer class="chat-footer">
            <button class="icon-btn" onclick="anunciarUbicacion()" title="Anunciar Ubicación" style="margin-right: 4px; background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);">
                <span class="material-symbols-rounded">location_on</span>
            </button>
            
            <div class="input-wrapper">
                <input
                    type="text"
                    id="mensaje"
                    placeholder="Escribe un mensaje ,idea,opinión,critica los monos XD..."
                    autocomplete="off"
                >
            </div>
            
            <button class="send-btn" onclick="enviar()" title="Enviar mensaje ( o chisme)">
                <span class="material-symbols-rounded">send</span>
            </button>
        </footer>
    </div>
    
    <!-- Snackbar -->
    <div class="snackbar" id="snackbar">
        <span class="material-symbols-rounded" id="snackbarIcon">info</span>
        <span id="snackbarText">Notificación</span>
    </div>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <script>
        // =====================================
        // ESTADO GLOBAL
        // =====================================
        var socket = io();
        var nombre = "";
        var mensajesHistorial = [];
        
        // =====================================
        // INICIALIZACIÓN
        // =====================================
        document.addEventListener('DOMContentLoaded', function() {
            // Cargar tema guardado
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
            
            const modal = document.getElementById('welcomeModal');
            
            // Cargar nombre si ya existe
            const savedName = localStorage.getItem('nombre');
            const savedInfo = localStorage.getItem('infoTaxi') || "";
            if (savedName) {
                nombre = savedName;
                modal.close();
                actualizarHeaderAvatar();
                mostrarSnackbar("Sesión restaurada: ¡Hola de nuevo, " + nombre + "!");
                socket.send(nombre + savedInfo + " se ha reconectado");
            } else {
                if (typeof modal.showModal === 'function') {
                    modal.showModal();
                } else {
                    modal.style.display = 'block';
                }
                document.getElementById('nombre').focus();
            }
            
            // Listener de vista previa para el avatar
            const nombreInput = document.getElementById('nombre');
            nombreInput.addEventListener('input', function() {
                const text = nombreInput.value.trim();
                const preview = document.getElementById('avatarPreview');
                if (text.length > 0) {
                    preview.textContent = getInitials(text);
                    preview.style.backgroundColor = getAvatarColor(text);
                } else {
                    preview.textContent = "?";
                    preview.style.backgroundColor = "var(--md-sys-color-primary-container)";
                }
            });
            
            // Enviar con Enter
            document.getElementById('mensaje').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    enviar();
                }
            });
            
            document.getElementById('nombre').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    guardarNombre();
                }
            });
        });
        
        // =====================================
        // AVATAR GENERATION
        // =====================================
        function getInitials(name) {
            if (!name) return "?";
            const parts = name.split(" ");
            if (parts.length > 1) {
                return (parts[0][0] + parts[1][0]).toUpperCase();
            }
            return name.substring(0, 2).toUpperCase();
        }
        
        function getAvatarColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            const h = Math.abs(hash % 360);
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const l = isDark ? 40 : 65;
            return `hsl(${h}, 65%, ${l}%)`;
        }
        
        function actualizarHeaderAvatar() {
            const avatarDiv = document.getElementById('headerChatAvatar');
            if (nombre) {
                avatarDiv.textContent = getInitials(nombre);
                avatarDiv.style.backgroundColor = getAvatarColor(nombre);
                avatarDiv.style.color = '#ffffff';
                avatarDiv.style.fontWeight = '700';
            }
        }
        
        // =====================================
        // TEMA CLARO/OSCURO
        // =====================================
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
            actualizarHeaderAvatar();
            renderizarHistorial();
        }
        
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeToggleIcon');
            icon.textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
        }
        
        // =====================================
        // CERRAR SESIÓN / CAMBIAR NOMBRE (REINICIO)
        // =====================================
        function cerrarSesion() {
            if (confirm("¿Estás seguro de que quieres cerrar sesión y salir del chat?")) {
                if (nombre) {
                    socket.send(nombre + " ha cerrado sesión");
                }
                localStorage.removeItem('nombre');
                nombre = "";
                location.reload();
            }
        }
        
        // =====================================
        // CAMBIAR NOMBRE DIRECTAMENTE
        // =====================================
        function cambiarNombre() {
            let nuevoNombre = prompt("Ingresa tu nuevo nombre de usuario:", nombre);
            if (nuevoNombre === null) return; // Cancelado
            nuevoNombre = nuevoNombre.trim();
            if (nuevoNombre === "") {
                mostrarSnackbar("El nombre no puede estar vacío", "warning");
                return;
            }
            
            let nombreAnterior = nombre;
            nombre = nuevoNombre;
            localStorage.setItem('nombre', nombre);
            actualizarHeaderAvatar();
            
            // Notificar a la sala el cambio de nombre
            socket.send(nombreAnterior + " ha cambiado su nombre a " + nombre);
            mostrarSnackbar("Nombre cambiado a: " + nombre);
            renderizarHistorial(); // Re-renderizar burbujas
        }
        
        // =====================================
        // ACCIONES DE REGISTRO & ENVÍO
        // =====================================
        function guardarNombre() {
            let inputNombre = document.getElementById("nombre");
            let inputApellido = document.getElementById("apellido");
            let inputPlaca = document.getElementById("placa");
            let inputModelo = document.getElementById("modelo");
            
            let valNombre = inputNombre.value.trim();
            let valApellido = inputApellido.value.trim();
            let valPlaca = inputPlaca.value.trim();
            let valModelo = inputModelo.value.trim();
            
            if (valNombre == "" || valApellido == "" || valPlaca == "" || valModelo == "") {
                mostrarSnackbar("Por favor, completa todos los campos", "warning");
                return;
            }
            
            nombre = valNombre + " " + valApellido;
            let infoTaxi = " (Placa: " + valPlaca + ", Modelo: " + valModelo + ")";
            
            localStorage.setItem('nombre', nombre);
            localStorage.setItem('infoTaxi', infoTaxi);
            
            const modal = document.getElementById("welcomeModal");
            if (typeof modal.close === 'function') {
                modal.close();
            } else {
                modal.style.display = 'none';
            }
            
            actualizarHeaderAvatar();
            socket.send(nombre + infoTaxi + " se ha unido al chat");
            mostrarSnackbar("¡Bienvenido, " + nombre + "!");
            document.getElementById("mensaje").focus();
        }
        
        function enviar() {
            let mensajeInput = document.getElementById("mensaje");
            let mensaje = mensajeInput.value.trim();
            
            if (nombre === "") {
                mostrarSnackbar("Debes ingresar tu nombre primero", "warning");
                return;
            }
            
            if (mensaje === "") {
                return;
            }
            
            socket.send(nombre + ": " + mensaje);
            mensajeInput.value = "";
            mensajeInput.focus();
        }

        function anunciarUbicacion() {
            if (nombre === "") {
                mostrarSnackbar("Debes ingresar tu nombre primero", "warning");
                return;
            }
            
            if ("geolocation" in navigator) {
                mostrarSnackbar("Obteniendo tu ubicación GPS...", "info");
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    
                    let infoTaxi = localStorage.getItem('infoTaxi') || "";
                    let textoAnuncio = `${nombre}${infoTaxi} está libre y anunció su ubicación: ${mapsLink}`;
                    
                    socket.send(nombre + ": /anunciar " + textoAnuncio);
                    mostrarSnackbar("Ubicación GPS enviada a la central y Telegram", "success");
                }, function(error) {
                    // Fallback a texto si el usuario deniega el permiso GPS
                    let ubicacion = prompt("📍 No pudimos obtener tu GPS. Escribe dónde te encuentras:\nEjemplo: 'Plaza Principal', etc.");
                    if (ubicacion && ubicacion.trim() !== "") {
                        let infoTaxi = localStorage.getItem('infoTaxi') || "";
                        let textoAnuncio = `${nombre}${infoTaxi} se encuentra disponible en: ${ubicacion.trim()}`;
                        socket.send(nombre + ": /anunciar " + textoAnuncio);
                        mostrarSnackbar("Ubicación enviada correctamente", "success");
                    }
                });
            } else {
                mostrarSnackbar("Tu navegador no soporta GPS.", "error");
            }
        }
        
        // =====================================
        // RECIBIR MENSAJES SOCKET.IO
        // =====================================
        socket.on("message", function(msg) {
            agregarAlHistorial(msg, false);
        });
        
        socket.on("telegram_message", function(msg) {
            agregarAlHistorial(msg, true);
        });
        
        function agregarAlHistorial(msg, esTelegram) {
            let sender = "Sistema";
            let text = msg;
            let esSistema = true;
            
            if (msg.includes(":")) {
                let partes = msg.split(":");
                sender = partes[0].trim();
                text = partes.slice(1).join(":").trim();
                esSistema = false;
            }
            
            mensajesHistorial.push({
                sender: sender,
                text: text,
                time: obtenerHora(),
                esSistema: esSistema,
                esTelegram: esTelegram
            });
            
            renderizarHistorial();
        }
        
        // =====================================
        // RENDERIZADOR DE FEED CON AGRUPAMIENTO
        // =====================================
        function renderizarHistorial() {
            const chatContainer = document.getElementById("chat");
            chatContainer.innerHTML = "";
            
            mensajesHistorial.forEach((msg, index) => {
                if (msg.esSistema) {
                    agregarElementoSistema(msg.text);
                } else {
                    const sender = msg.sender;
                    const isCurrentUser = (sender === nombre);
                    
                    const prevMsg = mensajesHistorial[index - 1];
                    const nextMsg = mensajesHistorial[index + 1];
                    
                    const isSameAsPrev = prevMsg && !prevMsg.esSistema && prevMsg.sender === sender;
                    const isSameAsNext = nextMsg && !nextMsg.esSistema && nextMsg.sender === sender;
                    
                    let isStart = !isSameAsPrev && isSameAsNext;
                    let isMiddle = isSameAsPrev && isSameAsNext;
                    let isEnd = isSameAsPrev && !isSameAsNext;
                    
                    agregarElementoMensaje(sender, msg.text, msg.time, isCurrentUser, isStart, isMiddle, isEnd);
                }
            });
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // =====================================
        // RENDERIZADORES DOM
        // =====================================
        function agregarElementoMensaje(sender, text, time, isCurrentUser, isStart, isMiddle, isEnd) {
            const chatContainer = document.getElementById("chat");
            
            const mensajeDiv = document.createElement("div");
            mensajeDiv.className = "mensaje " + (isCurrentUser ? "remitente" : "destinatario");
            
            if (isStart) mensajeDiv.classList.add("grouped-start");
            if (isMiddle) mensajeDiv.classList.add("grouped-middle");
            if (isEnd) mensajeDiv.classList.add("grouped-end");
            
            // Nombre del remitente (solo si no es el usuario actual, y es el primer mensaje de la secuencia)
            if (!isCurrentUser && !isMiddle && !isEnd) {
                const usuarioDiv = document.createElement("div");
                usuarioDiv.className = "mensaje-usuario";
                usuarioDiv.textContent = sender;
                mensajeDiv.appendChild(usuarioDiv);
            }
            
            // Burbuja
            const bubble = document.createElement("div");
            bubble.className = "mensaje-bubble";
            bubble.textContent = text;
            mensajeDiv.appendChild(bubble);
            
            // Avatar (solo si es destinatario y es el último de la secuencia de mensajes agrupados)
            if (!isCurrentUser && (!isMiddle && !isEnd || isEnd)) {
                const avatar = document.createElement("div");
                avatar.className = "mensaje-avatar";
                avatar.style.backgroundColor = getAvatarColor(sender);
                avatar.textContent = getInitials(sender);
                mensajeDiv.appendChild(avatar);
            }
            
            // Hora (solo si no está en medio o inicio)
            if (!isMiddle && !isStart) {
                const tiempoDiv = document.createElement("div");
                tiempoDiv.className = "mensaje-tiempo";
                tiempoDiv.textContent = time;
                mensajeDiv.appendChild(tiempoDiv);
            }
            
            chatContainer.appendChild(mensajeDiv);
        }
        
        // Mensajes de sistema
        function agregarElementoSistema(texto) {
            const chatContainer = document.getElementById("chat");
            
            const mensajeDiv = document.createElement("div");
            mensajeDiv.className = "mensaje sistema";
            
            const bubble = document.createElement("div");
            bubble.className = "mensaje-bubble";
            // Usar innerHTML para que los SVG se rendericen en los mensajes de sistema
            bubble.innerHTML = texto;
            
            mensajeDiv.appendChild(bubble);
            chatContainer.appendChild(mensajeDiv);
        }
        
        // =====================================
        // AUXILIARES
        // =====================================
        function obtenerHora() {
            let ahora = new Date();
            let horas = ahora.getHours().toString().padStart(2, '0');
            let minutos = ahora.getMinutes().toString().padStart(2, '0');
            return horas + ':' + minutos;
        }
        
        function mostrarSnackbar(texto, tipo = "info") {
            let snackbar = document.getElementById("snackbar");
            let snackbarText = document.getElementById("snackbarText");
            let snackbarIcon = document.getElementById("snackbarIcon");
            
            snackbarText.textContent = texto;
            snackbarIcon.textContent = tipo === "warning" ? "warning" : "info";
            
            snackbar.classList.add("show");
            
            setTimeout(function() {
                snackbar.classList.remove("show");
            }, 3000);
        }
    </script>
</body>
